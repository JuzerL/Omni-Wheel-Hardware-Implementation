controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    omni_wheel_controller:
      type: omni_wheel_controller/OmniWheelController


omni_wheel_controller:
  ros__parameters:

    # -------------------------
    # Joint Configuration
    # -------------------------
    # -------------------------
    # Joint Configuration
    # -------------------------
    omni_wheel_names:
      - front_left_wheel_joint
      - front_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint

    # Example angles in radians (45, 135, 225, 315 degrees)
    # You will need to adjust these based on your actual CAD model!
    omni_wheel_angle: [0.785398, 2.35619, 3.92699, 5.49779] 

    command_interfaces:
      - velocity

    state_interfaces:
      - position
      - velocity

    # -------------------------
    # Robot Kinematics
    # -------------------------
    wheel_radius: 0.05          # meters
    omni_wheel_distance: 0.25   # center → wheel distance

    # -------------------------
    # Limits
    # -------------------------
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 1.0
        has_acceleration_limits: true
        max_acceleration: 2.0

      y:
        has_velocity_limits: true
        max_velocity: 1.0
        has_acceleration_limits: true
        max_acceleration: 2.0

    angular:
      z:
        has_velocity_limits: true
        max_velocity: 2.0
        has_acceleration_limits: true
        max_acceleration: 3.0

    # -------------------------
    # Misc (recommended)
    # -------------------------
    cmd_vel_timeout: 0.5
    publish_rate: 50.0
